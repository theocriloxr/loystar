name: OAuth compatibility CI

on:
  push:
    branches:
      - fix/oauth-dcr-redirect-20260908
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Compile application
        run: python -m compileall -q src

      - name: Run full test suite
        run: pytest -q

      - name: Lint changed OAuth code
        run: ruff check src/oauth_client_compat.py tests/unit/test_production_security.py
