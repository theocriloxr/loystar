name: Clean MCP Core CI

on:
  push:
    branches:
      - rebuild/clean-mcp-core-20260908
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile clean core
        run: |
          python -m py_compile src/oauth_cimd_clean.py src/oauth_store_clean.py src/loystar_client_clean.py src/main_clean.py
      - name: Run clean-core regression tests
        run: pytest -q tests/unit/test_clean_core.py
      - name: Run full suite
        run: pytest -q
